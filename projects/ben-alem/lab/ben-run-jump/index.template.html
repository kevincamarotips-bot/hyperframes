<!doctype html>
<!--
  Teste de movimento (não é cena): Ben entra correndo, pula, aterrissa, freia e para.
  Gerado por tools/make_lab.py (SVG, rig e bibliotecas embutidos nos marcadores).
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #009fe3; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #009fe3; }
      #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: #000; }
      /* escala 0,42: a linha do chão do rig (y=885) cai em y=930 da tela */
      #stage { position: absolute; left: 0; top: 558px; width: 1398px; height: 972px; transform: scale(0.42); transform-origin: 0 0; }
      #stage svg { overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ben-run-jump" data-start="0" data-duration="5.2" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="stage"><!--BEN_SVG--></div>
    </div>
    <script type="module">
      /*__RIG_JS__*/
      /*__LOCO_JS__*/
      const rigDef = /*__RIG_JSON__*/ null;
      const rig = createRig(document.querySelector("#ben"), rigDef);
      const { driver: d, speed } = createLocomotion(rig);
      const eyes = [rig.slot("eye_back"), rig.slot("eye_front")];

      const V = speed(8 / 30); // ciclo de 8 frames
      const X0 = -1400; // entra já correndo pela esquerda
      const X_TAKEOFF = 300; // decola antes do centro
      const T_AIR = 0.86; // subida 0,46 s + descida 0,40 s (ápice segura mais)
      const H = 300; // altura do pulo (≈ 2/3 da altura do Ben: ele não pula alto)
      const T_TAKEOFF = (X_TAKEOFF - X0) / V;
      const T_LAND = T_TAKEOFF + T_AIR;
      const X_LAND = X_TAKEOFF + V * T_AIR;
      const X_BRAKE = X_LAND + 380;
      const T_DECEL = 0.7;
      const D_DECEL = (V * T_DECEL) / 2;
      const T_BRAKE = T_LAND + (X_BRAKE - X_LAND) / V;
      const T_STOP = T_BRAKE + T_DECEL;
      const DURATION = 5.2; // = data-duration (parada em ≈3,41 s + 1,8 s de atuação)

      const ben = gsap.timeline({ paused: true });
      ben.set(d, { x: X0, run: 1 }, 0);
      // a velocidade horizontal não muda no ar: o pulo é um arco, não uma parada
      ben.to(d, { x: X_BRAKE, duration: T_BRAKE, ease: "none" }, 0);

      // antecipação na última passada: abaixa, inclina, orelhas para trás, olhos no alvo
      ben.to(d, { sq: 0.84, pitch: 4, ear: -14, lookY: 6, duration: 0.2, ease: "power2.in" }, T_TAKEOFF - 0.2);

      // impulso: estica, decola, patas esticam (ones)
      ben.to(d, { sq: 1.14, duration: 0.08, ease: "expo.out" }, T_TAKEOFF);
      ben.to(d, { air: 1, duration: 0.1, ease: "power2.out" }, T_TAKEOFF);
      ben.to(d, { jy: H, duration: 0.46, ease: "power2.out" }, T_TAKEOFF); // sobe desacelerando
      ben.to(d, { jy: 0, duration: 0.4, ease: "power2.in" }, T_TAKEOFF + 0.46); // cai acelerando
      // o corpo acompanha a tangente do arco: nariz para cima subindo, para baixo caindo
      ben.to(d, { pitch: -9, duration: 0.3, ease: "power2.out" }, T_TAKEOFF);
      ben.to(d, { pitch: 8, duration: 0.5, ease: "sine.inOut" }, T_TAKEOFF + 0.32);
      ben.to(d, { sq: 1, duration: 0.25, ease: "power2.out" }, T_TAKEOFF + 0.1);
      ben.to(d, { sq: 1.08, duration: 0.3, ease: "power2.in" }, T_LAND - 0.3); // estica na queda
      // orelhas e cauda arrastam: para baixo/trás na subida, sobem na queda
      ben.to(d, { ear: -28, tail: -14, duration: 0.22, ease: "power2.out" }, T_TAKEOFF);
      ben.to(d, { ear: 6, tail: 10, duration: 0.3, ease: "sine.inOut" }, T_TAKEOFF + 0.3);
      ben.to(d, { ear: 20, tail: 22, duration: 0.25, ease: "power2.in" }, T_LAND - 0.25);
      // no ápice: olhos arregalados para cima (encantamento rápido)
      ben.to(d, { lookY: -14, look: 6, duration: 0.15, ease: "power2.out" }, T_TAKEOFF + 0.3);
      ben.to(d, { lookY: 6, look: 0, duration: 0.2, ease: "power2.inOut" }, T_LAND - 0.25);

      // aterrissagem: contato, squash forte, recuperação elástica e volta a correr
      ben.to(d, { air: 0, duration: 0.12, ease: "power2.out" }, T_LAND);
      ben.to(d, { sq: 0.76, pitch: 3, duration: 0.07, ease: "none" }, T_LAND);
      ben.to(d, { sq: 1, pitch: 0, duration: 0.5, ease: "elastic.out(1, 0.45)" }, T_LAND + 0.07);
      ben.to(d, { head: 9, duration: 0.08, ease: "power2.out" }, T_LAND);
      ben.to(d, { head: 0, duration: 0.5, ease: "back.out(1.8)" }, T_LAND + 0.08);
      ben.to(d, { ear: 0, tail: 0, lookY: 0, duration: 0.8, ease: "elastic.out(1, 0.3)" }, T_LAND + 0.05);

      // freada e parada (mesma do teste de corrida)
      ben.to(d, { x: X_BRAKE + D_DECEL, duration: T_DECEL, ease: "power2.out" }, T_BRAKE);
      ben.to(d, { run: 0, duration: T_DECEL, ease: "power2.in" }, T_BRAKE);
      ben.to(d, { brake: 1, duration: 0.3, ease: "power2.out" }, T_BRAKE + 0.1);
      ben.to(d, { brake: 0, duration: 0.45, ease: "back.out(1.4)" }, T_STOP - 0.05);
      ben.to(d, { pitch: 4, head: 7, sq: 0.94, duration: 0.12, ease: "power2.out" }, T_STOP - 0.08);
      ben.to(d, { pitch: 0, head: 0, duration: 0.6, ease: "back.out(1.8)" }, T_STOP + 0.04);
      ben.to(d, { sq: 1, duration: 0.6, ease: "elastic.out(1, 0.45)" }, T_STOP + 0.04);
      ben.to(d, { ear: 24, duration: 0.14, ease: "power2.out" }, T_STOP - 0.04);
      ben.to(d, { ear: 0, duration: 1.0, ease: "elastic.out(1, 0.3)" }, T_STOP + 0.1);
      ben.to(d, { tail: 18, duration: 0.14, ease: "power2.out" }, T_STOP);
      ben.to(d, { tail: 0, duration: 0.9, ease: "elastic.out(1, 0.35)" }, T_STOP + 0.14);

      // orgulhoso: olha para trás, para o lugar do pulo, e fica contente
      ben.to(d, { look: -34, lookY: 4, duration: 0.15, ease: "power2.out" }, T_STOP + 0.55);
      ben.to(d, { head: -3, duration: 0.35, ease: "power2.inOut" }, T_STOP + 0.62);
      ben.to(d, { look: 0, lookY: 0, head: 0, duration: 0.3, ease: "power2.inOut" }, T_STOP + 1.1);
      ben.set(eyes, { i: 1 }, T_STOP + 1.4);
      ben.to(d, { tail: 9, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_STOP + 1.4);
      ben.set({}, {}, DURATION);

      // corrida, pulo e freada em ones; a atuação depois da parada em twos
      const tl = gsap.timeline({ paused: true });
      tl.add(ben.tweenFromTo(0, DURATION, { duration: DURATION, ease: exposureEase(DURATION, T_STOP + 0.5) }), 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["ben-run-jump"] = tl;
    </script>
  </body>
</html>
