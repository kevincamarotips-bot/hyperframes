<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MorphSVGPlugin.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #393939; }
      #root { position: relative; width: 1280px; height: 720px; background: #393939; }
      #gl { position: absolute; inset: 0; width: 1280px; height: 720px; }
      #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #000; }
      #ear-test { position: absolute; left: 40px; top: 40px; width: 160px; height: 160px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="spike" data-start="0" data-duration="3" data-width="1280" data-height="720">
      <div id="ground"></div>
      <canvas id="gl" width="1280" height="720"></canvas>
      <svg id="ear-test" viewBox="0 0 100 100">
        <path id="ear" d="M20,95 C30,60 40,25 55,5 C62,30 72,62 80,95 Z" fill="#000" />
        <path id="ear-bent" d="M20,95 C24,62 40,40 78,22 C70,48 74,70 80,95 Z" fill="none" />
      </svg>
    </div>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
      gsap.registerPlugin(MorphSVGPlugin);

      // Registered root timeline (on ones): MorphSVG proof on a vector part.
      const tl = gsap.timeline({ paused: true });
      tl.to("#ear", { morphSVG: "#ear-bent", duration: 0.4, ease: "power2.in" }, 0.5)
        .to("#ear", { morphSVG: "#ear", duration: 0.9, ease: "elastic.out(1, 0.35)" }, 1.0)
        .set({}, {}, 3);

      // Character rig params live on a separate paused timeline, sampled on twos.
      const rig = { squash: 1, bend: 0, lift: 0, earAngle: 0 };
      const ben = gsap.timeline({ paused: true });
      ben.to(rig, { squash: 0.8, bend: -0.04, duration: 0.3, ease: "power2.in" }, 0.2)    // anticipation
         .to(rig, { squash: 1.22, bend: 0.03, lift: 0.18, duration: 0.17, ease: "expo.out" }, 0.55) // takeoff stretch
         .to(rig, { earAngle: -0.45, duration: 0.17, ease: "power2.out" }, 0.6)              // ears drag behind
         .to(rig, { squash: 1, lift: 0.26, bend: 0, duration: 0.3, ease: "power2.out" }, 0.72) // rise to apex
         .to(rig, { lift: 0, squash: 1.1, duration: 0.33, ease: "power2.in" }, 1.1)           // fall
         .to(rig, { squash: 0.72, bend: -0.05, duration: 0.07, ease: "none" }, 1.43)         // impact squash
         .to(rig, { earAngle: 0.5, duration: 0.1, ease: "power2.out" }, 1.45)               // ears overshoot
         .to(rig, { squash: 1, bend: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, 1.5)  // recovery
         .to(rig, { earAngle: 0, duration: 0.9, ease: "elastic.out(1, 0.3)" }, 1.58);        // ear follow-through

      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1280, 720, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(0, 1280, 720, 0, -10, 10);

      const W = 700, H = 700 * 972 / 1398;
      const geo = new THREE.PlaneGeometry(W, H, 48, 32);
      geo.translate(W / 2, H / 2, 0); // origin at bottom-left (feet line)
      const rest = Float32Array.from(geo.attributes.position.array);
      const tex = new THREE.TextureLoader().load("assets/ben-pose.png", () => draw(lastT));
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
      mesh.position.set(290, 70, 0);
      scene.add(mesh);

      // Localized deformers on the raster: volume-preserving squash anchored at the feet,
      // spine arc, and an ear region rotated about its base with falloff toward the tip.
      const EAR_BASE = { x: 0.68 * W, y: 0.62 * H };
      function deform() {
        const p = geo.attributes.position.array;
        const sy = rig.squash, sx = 1 / Math.sqrt(sy);
        for (let i = 0; i < p.length; i += 3) {
          let x = rest[i], y = rest[i + 1];
          const u = x / W, v = y / H;
          // ears region: upper part of the head
          if (v > 0.62 && u > 0.5 && u < 0.84) {
            const w = Math.min(1, (v - 0.62) / 0.35) ** 1.5;
            const a = rig.earAngle * w, dx = x - EAR_BASE.x, dy = y - EAR_BASE.y;
            x = EAR_BASE.x + dx * Math.cos(a) - dy * Math.sin(a);
            y = EAR_BASE.y + dx * Math.sin(a) + dy * Math.cos(a);
          }
          const cx = W * 0.5;
          x = cx + (x - cx) * (1 + (sx - 1) * (0.6 + 0.4 * v)); // feet widen less than the back
          y = y * sy + rig.bend * H * Math.sin(Math.PI * u) * (y / H);
          p[i] = x; p[i + 1] = y + rig.lift * 720;
        }
        geo.attributes.position.needsUpdate = true;
      }

      const TWOS = 15;
      let lastT = 0;
      function draw(t) {
        lastT = t;
        ben.seek(Math.floor(t * TWOS + 1e-6) / TWOS, false); // character poses held on twos
        deform();
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      draw(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["spike"] = tl;
    </script>
  </body>
</html>
